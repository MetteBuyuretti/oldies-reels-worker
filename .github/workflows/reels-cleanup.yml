name: Oldies Reels Storage Cleanup

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List old delivery MP4s without deleting them"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "35 3 * * *"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete delivery MP4s older than 10 days
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request
          from datetime import datetime, timedelta, timezone

          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          dry_run = str(os.environ.get("DRY_RUN", "false")).lower() == "true"
          cutoff = datetime.now(timezone.utc) - timedelta(days=10)

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "oldies-reels-cleanup",
          }

          def request(url, method="GET"):
              req = urllib.request.Request(url, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=60) as response:
                      body = response.read()
                      return json.loads(body) if body else {}
              except urllib.error.HTTPError as exc:
                  if exc.code == 404:
                      return None
                  detail = exc.read().decode("utf-8", "replace")
                  raise RuntimeError(f"GitHub API {exc.code}: {detail[:500]}") from exc

          release = request(f"https://api.github.com/repos/{repo}/releases/tags/reels-delivery")
          if not release:
              print("No reels-delivery release exists; nothing to clean.")
              sys.exit(0)

          release_id = release.get("id")
          if not release_id:
              raise RuntimeError("reels-delivery release returned no id")

          assets = []
          page = 1
          while True:
              batch = request(
                  f"https://api.github.com/repos/{repo}/releases/{release_id}/assets?per_page=100&page={page}"
              ) or []
              assets.extend(batch)
              if len(batch) < 100:
                  break
              page += 1

          deleted = 0
          kept = 0
          for asset in assets:
              name = str(asset.get("name", ""))
              if not name.lower().endswith(".mp4"):
                  kept += 1
                  continue
              created_raw = str(asset.get("created_at", ""))
              try:
                  created = datetime.fromisoformat(created_raw.replace("Z", "+00:00"))
              except ValueError:
                  print(f"KEEP unreadable timestamp: {name} ({created_raw})")
                  kept += 1
                  continue
              if created >= cutoff:
                  kept += 1
                  continue

              asset_id = asset.get("id")
              age_days = (datetime.now(timezone.utc) - created).days
              if dry_run:
                  print(f"DRY RUN delete: {name} ({age_days} days old)")
                  continue
              request(f"https://api.github.com/repos/{repo}/releases/assets/{asset_id}", method="DELETE")
              print(f"DELETED: {name} ({age_days} days old)")
              deleted += 1

          print(f"Cleanup complete. deleted={deleted}, kept={kept}, cutoff={cutoff.isoformat()}")
          PY
