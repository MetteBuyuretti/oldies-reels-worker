name: Oldies Reels Storage Cleanup

on:
  workflow_dispatch:
  schedule:
    - cron: "35 3 * * *"

permissions:
  contents: read

concurrency:
  group: oldies-reels-retention-inventory
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate conservative retention policy
        run: python -m unittest -v test_retention_policy
      - name: Inventory delivery MP4s without deleting or mutating them
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: python cleanup_inventory.py
