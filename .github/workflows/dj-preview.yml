name: Rolling Stones DJ Preview Only
on:
  push:
    branches:
      - fix/turkish-dj-announcements
    paths:
      - .github/workflows/dj-preview.yml
permissions:
  contents: read
  id-token: write
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/36507074949/locations/global/workloadIdentityPools/github-oldies/providers/github-oldies-reels"
          service_account: "oldies-reels-tts@project-8af3c2f9-bd84-4afe-b8a.iam.gserviceaccount.com"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install -r requirements.txt
      - name: Render isolated Rolling Stones preview
        env:
          OLDIES_WP_BEARER: ${{ secrets.OLDIES_WP_BEARER }}
          OLDIES_WP_BASE_URL: ${{ vars.OLDIES_WP_BASE_URL }}
          OLDIES_PREVIEW_ONLY: "true"
          OLDIES_ZERO_COST_DATE: "2026-09-22"
          OLDIES_PREVIEW_ARTIST: "The Rolling Stones"
          OLDIES_REELS_LANGUAGE: "tr"
          OLDIES_TTS_ENABLED: "true"
          OLDIES_TTS_ENGINE: "chirp_dj"
          OLDIES_GCP_PROJECT: "project-8af3c2f9-bd84-4afe-b8a"
        run: python worker.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rolling-stones-dj-preview
          path: output/
          retention-days: 7
          if-no-files-found: ignore

