name: Oldies Reels Zero-Cost Draft Worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oldies-reels-zero-cost-draft-worker
  cancel-in-progress: false

jobs:
  create-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install renderer and zero-cost Python packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          pip install "Pillow>=11.0.0,<13" "requests>=2.32.0,<3"
      - name: Validate zero-cost worker
        run: |
          python -m py_compile worker_zero_cost.py zero_cost.py
      - name: Research, render and upload review draft
        env:
          OLDIES_WP_BEARER: ${{ secrets.OLDIES_WP_BEARER }}
          OLDIES_WP_BASE_URL: ${{ vars.OLDIES_WP_BASE_URL }}
        run: python worker_zero_cost.py
      - name: Keep preview for seven days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oldies-reels-zero-cost-preview
          path: output/
          retention-days: 7
          if-no-files-found: ignore
