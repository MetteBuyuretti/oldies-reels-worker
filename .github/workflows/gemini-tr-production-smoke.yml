name: Gemini TR Production Smoke

on:
  push:
    branches:
      - gemini-flash-tr-production

permissions:
  contents: read
  id-token: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/36507074949/locations/global/workloadIdentityPools/github-oldies/providers/github-oldies-reels"
          service_account: "oldies-reels-tts@project-8af3c2f9-bd84-4afe-b8a.iam.gserviceaccount.com"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Render TR preview
        env:
          OLDIES_WP_BEARER: ${{ secrets.OLDIES_WP_BEARER }}
          OLDIES_WP_BASE_URL: ${{ vars.OLDIES_WP_BASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          OLDIES_PREVIEW_ONLY: "true"
          OLDIES_REELS_LANGUAGE: "tr"
          OLDIES_TTS_ENABLED: "true"
          OLDIES_TTS_ENGINE: "auto"
          OLDIES_GEMINI_TTS_VOICE: "Charon"
          OLDIES_TTS_FALLBACK: "true"
          OLDIES_TTS_VOICE: ""
          OLDIES_TTS_LANGUAGE: ""
          OLDIES_GCP_PROJECT: "project-8af3c2f9-bd84-4afe-b8a"
        run: python worker.py
      - name: Verify audio
        if: success()
        run: |
          ffprobe -v error -select_streams a:0 -show_entries stream=sample_rate,channels -of default=noprint_wrappers=1 output/oldies-reels-draft.mp4
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 output/oldies-reels-draft.mp4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gemini-tr-production-preview
          path: output/
          retention-days: 3
          if-no-files-found: ignore
