name: Draft delivery tests
on:
  pull_request:
    paths:
      - "worker.py"
      - "test_worker_delivery.py"
      - "test_delivery_audit.py"
      - ".github/workflows/delivery-tests.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest -v test_worker_delivery test_delivery_audit
