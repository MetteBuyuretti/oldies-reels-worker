name: OLDIES WATCHDOG (audit only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oldies-watchdog.yml'
      - 'monitoring/**'
  schedule:
    - cron: '37 * * * *'
  pull_request:
    paths:
      - '.github/workflows/oldies-watchdog.yml'
      - 'monitoring/**'
permissions:
  actions: read
  contents: read
  issues: read
concurrency:
  group: oldies-watchdog-${{ github.ref }}
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test audit logic
        run: cd monitoring && python -m unittest -v test_watchdog.py
      - name: Check GitHub workflow health
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python monitoring/watchdog.py
