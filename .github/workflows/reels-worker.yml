name: Oldies Reels Draft Worker

on:
  workflow_dispatch:
    inputs:
      voiceover_url:
        description: "Optional HTTPS voiceover file (MP3/WAV/M4A/AAC/MP4)"
        required: false
        type: string
      preview_only:
        description: "Render artifact only; do not create a WordPress review draft"
        required: false
        default: false
        type: boolean
      reels_language:
        description: "Reels language: tr or en"
        required: false
        default: "tr"
        type: string
      facebook_global_dry_run:
        description: "Validate Facebook Global delivery without publishing"
        required: false
        default: true
        type: boolean
      tts_enabled:
        description: "Generate the matching DJ voice automatically"
        required: false
        default: true
        type: boolean
      gemini_tts_voice:
        description: "Turkish Gemini Flash voice (Charon/Fenrir/Iapetus)"
        required: false
        default: "Charon"
        type: string
      tts_voice:
        description: "Optional Chirp 3 HD fallback / English voice override"
        required: false
        default: ""
        type: string
  schedule:
    - cron: "0 9 * * *"

permissions:
  contents: write
  id-token: write

concurrency:
  group: oldies-reels-draft-worker
  cancel-in-progress: false

jobs:
  create-draft:
    if: github.event_name == 'workflow_dispatch' || vars.REELS_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/36507074949/locations/global/workloadIdentityPools/github-oldies/providers/github-oldies-reels"
          service_account: "oldies-reels-tts@project-8af3c2f9-bd84-4afe-b8a.iam.gserviceaccount.com"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install renderer and Python packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Research, render and upload review draft
        env:
          OLDIES_WP_BEARER: ${{ secrets.OLDIES_WP_BEARER }}
          OLDIES_WP_BASE_URL: ${{ vars.OLDIES_WP_BASE_URL }}
          OLDIES_FACEBOOK_GLOBAL_DRY_RUN: ${{ inputs.facebook_global_dry_run == false && 'false' || 'true' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          OLDIES_VOICEOVER_URL: ${{ inputs.voiceover_url }}
          OLDIES_PREVIEW_ONLY: ${{ inputs.preview_only }}
          OLDIES_REELS_LANGUAGE: ${{ inputs.reels_language || 'tr' }}
          OLDIES_TTS_ENABLED: ${{ github.event_name == 'schedule' && 'true' || (inputs.tts_enabled && 'true' || 'false') }}
          OLDIES_TTS_ENGINE: "auto"
          OLDIES_GEMINI_TTS_VOICE: ${{ inputs.gemini_tts_voice || 'Charon' }}
          OLDIES_TTS_FALLBACK: "true"
          OLDIES_TTS_VOICE: ${{ inputs.tts_voice }}
          OLDIES_TTS_LANGUAGE: ""
          OLDIES_GCP_PROJECT: "project-8af3c2f9-bd84-4afe-b8a"
        run: python worker.py
      - name: Keep preview for seven days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oldies-reels-preview-${{ inputs.reels_language || 'tr' }}
          path: output/
          retention-days: 7
          if-no-files-found: ignore

  facebook-global:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/36507074949/locations/global/workloadIdentityPools/github-oldies/providers/github-oldies-reels"
          service_account: "oldies-reels-tts@project-8af3c2f9-bd84-4afe-b8a.iam.gserviceaccount.com"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install renderer and Python packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Research, render and validate Facebook Global Reel
        env:
          OLDIES_WP_BEARER: ${{ secrets.OLDIES_WP_BEARER }}
          OLDIES_WP_BASE_URL: ${{ vars.OLDIES_WP_BASE_URL }}
          OLDIES_FACEBOOK_GLOBAL_DRY_RUN: "true"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          OLDIES_VOICEOVER_URL: ""
          OLDIES_PREVIEW_ONLY: "false"
          OLDIES_REELS_LANGUAGE: "en"
          OLDIES_TTS_ENABLED: "true"
          OLDIES_TTS_ENGINE: "auto"
          OLDIES_GEMINI_TTS_VOICE: "Charon"
          OLDIES_TTS_FALLBACK: "true"
          OLDIES_TTS_VOICE: ""
          OLDIES_TTS_LANGUAGE: ""
          OLDIES_GCP_PROJECT: "project-8af3c2f9-bd84-4afe-b8a"
        run: python worker.py
      - name: Keep Facebook Global preview for seven days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oldies-facebook-global-preview
          path: output/
          retention-days: 7
          if-no-files-found: ignore
