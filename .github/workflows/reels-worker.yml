name: Oldies Reels Draft Worker

on:
  workflow_dispatch:
    inputs:
      voiceover_url:
        description: "Optional HTTPS voiceover file (MP3/WAV/M4A/AAC/MP4)"
        required: false
        type: string
      preview_only:
        description: "Render artifact only; do not create a WordPress review draft"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 9 * * *"

permissions:
  contents: write

concurrency:
  group: oldies-reels-draft-worker
  cancel-in-progress: false

jobs:
  create-draft:
    if: github.event_name == 'workflow_dispatch' || vars.REELS_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install renderer and Python packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Research, render and upload review draft
        env:
          OLDIES_WP_BEARER: ${{ secrets.OLDIES_WP_BEARER }}
          OLDIES_WP_BASE_URL: ${{ vars.OLDIES_WP_BASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          OLDIES_VOICEOVER_URL: ${{ inputs.voiceover_url }}
          OLDIES_PREVIEW_ONLY: ${{ inputs.preview_only }}
        run: python worker.py
      - name: Keep preview for seven days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oldies-reels-preview
          path: output/
          retention-days: 7
          if-no-files-found: ignore

