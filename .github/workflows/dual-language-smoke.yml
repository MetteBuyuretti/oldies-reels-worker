name: Dual Language 15s Smoke Test

on:
  push:
    branches:
      - dual-language-15s

permissions:
  contents: read
  id-token: write

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        language: [tr, en]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/36507074949/locations/global/workloadIdentityPools/github-oldies/providers/github-oldies-reels"
          service_account: "oldies-reels-tts@project-8af3c2f9-bd84-4afe-b8a.iam.gserviceaccount.com"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Render preview only
        env:
          OLDIES_WP_BEARER: ${{ secrets.OLDIES_WP_BEARER }}
          OLDIES_WP_BASE_URL: ${{ vars.OLDIES_WP_BASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          OLDIES_PREVIEW_ONLY: "true"
          OLDIES_TTS_ENABLED: "true"
          OLDIES_REELS_LANGUAGE: ${{ matrix.language }}
          OLDIES_TTS_VOICE: ""
          OLDIES_TTS_LANGUAGE: ""
          OLDIES_GCP_PROJECT: "project-8af3c2f9-bd84-4afe-b8a"
        run: python worker.py
      - name: Keep preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dual-language-${{ matrix.language }}
          path: output/
          retention-days: 3
          if-no-files-found: ignore
