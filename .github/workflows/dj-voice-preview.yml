name: Turkish DJ voice preview

on:
  push:
    branches: [fix/turkish-dj-announcements]
    paths:
      - "preview_voice.py"
      - "worker.py"
      - ".github/workflows/dj-voice-preview.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  voice-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/36507074949/locations/global/workloadIdentityPools/github-oldies/providers/github-oldies-reels"
          service_account: "oldies-reels-tts@project-8af3c2f9-bd84-4afe-b8a.iam.gserviceaccount.com"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt
      - name: Generate two isolated voice auditions
        env:
          OLDIES_GCP_PROJECT: "project-8af3c2f9-bd84-4afe-b8a"
          OLDIES_PREVIEW_VOICES: "Charon,Fenrir"
        run: python preview_voice.py
      - name: Keep the audio for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: john-lennon-dj-voice-preview
          path: output/dj-voice-preview/
          retention-days: 7
          if-no-files-found: ignore
