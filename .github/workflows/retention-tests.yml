name: Read-only retention tests

on:
  pull_request:
    paths:
      - ".github/workflows/reels-cleanup.yml"
      - ".github/workflows/retention-tests.yml"
      - "cleanup_inventory.py"
      - "retention_policy.py"
      - "test_cleanup_inventory.py"
      - "test_retention_policy.py"

permissions: {}

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read public repository at the PR commit
        env:
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_SHA: ${{ github.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git -c credential.helper= -c http.extraheader= fetch --depth=1 origin "$WORKFLOW_SHA"
          git checkout --detach FETCH_HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest -v test_retention_policy test_cleanup_inventory
      - name: Verify live public inventory with read-only requests
        env:
          REPOSITORY: ${{ github.repository }}
        run: python cleanup_inventory.py
