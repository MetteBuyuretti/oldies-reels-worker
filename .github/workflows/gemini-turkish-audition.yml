name: Turkish DJ Voice Audition

on:
  push:
    branches:
      - gemini-tts-natural-dj

permissions:
  contents: read
  id-token: write

jobs:
  audition:
    strategy:
      fail-fast: false
      matrix:
        voice: [Charon, Fenrir, Iapetus]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/36507074949/locations/global/workloadIdentityPools/github-oldies/providers/github-oldies-reels"
          service_account: "oldies-reels-tts@project-8af3c2f9-bd84-4afe-b8a.iam.gserviceaccount.com"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate Turkish DJ audition
        env:
          GOOGLE_PROJECT: "project-8af3c2f9-bd84-4afe-b8a"
          VOICE: ${{ matrix.voice }}
        run: |
          pip install requests google-auth
          python - <<'PY'
          import os, base64, requests
          import google.auth
          from google.auth.transport.requests import Request

          project=os.environ["GOOGLE_PROJECT"]
          voice=os.environ["VOICE"]
          creds,_=google.auth.default(scopes=["https://www.googleapis.com/auth/cloud-platform"])
          creds.refresh(Request())

          prompt=(
              "Türkçe konuşan deneyimli ve sevilen bir radyo DJ'i gibi oku. "
              "Sesin sıcak, içten, güler yüzlü ve önceki denemelerden belirgin biçimde daha canlı olsun. "
              "Dinleyiciye güzel bir müzik anısını heyecanla anlatıyormuşsun gibi konuş; ama kesinlikle reklam spikeri, haber spikeri veya fragman sesi olma. "
              "Cümlelerde küçük doğal iniş çıkışlar, mikro duraklamalar ve hafif bir gülümseme duyulsun. "
              "Frank Sinatra ve A Swingin' Affair ifadesini rahat, doğal İngilizce telaffuz et; Türkçeye dönerken ses karakterini değiştirme. "
              "Yedi hafta ifadesinde hafif şaşkın ve keyifli bir vurgu yap. "
              "Son cümlede Oldies Radyo'yu slogan gibi bağırma; sıcak, samimi, kendiliğinden gelen bir imza gibi bırak."
          )
          text=(
              "1957'ye gidiyoruz... Frank Sinatra'nın A Swingin' Affair albümü İngiltere'de bir numaraya çıktı. "
              "Ve tam yedi hafta zirvede kaldı! Güzel bir plak hikâyesi, değil mi? "
              "Müzik tarihinden küçük bir not daha... Oldies Radyo."
          )
          body={
              "input":{"prompt":prompt,"text":text},
              "voice":{"languageCode":"tr-TR","name":voice,"modelName":"gemini-2.5-flash-tts"},
              "audioConfig":{"audioEncoding":"MP3"}
          }
          r=requests.post(
              "https://texttospeech.googleapis.com/v1/text:synthesize",
              headers={
                  "Authorization":f"Bearer {creds.token}",
                  "x-goog-user-project":project,
                  "Content-Type":"application/json",
              },
              json=body,timeout=120
          )
          print("STATUS",r.status_code)
          if r.status_code>=400:
              print(r.text[:3000]); raise SystemExit(1)
          data=base64.b64decode(r.json()["audioContent"])
          os.makedirs("out",exist_ok=True)
          open(f"out/gemini-flash-dj-{voice.lower()}.mp3","wb").write(data)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: turkish-dj-${{ matrix.voice }}
          path: out/
          retention-days: 3
          if-no-files-found: ignore
