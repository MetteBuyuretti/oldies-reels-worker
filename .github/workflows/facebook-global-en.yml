name: Oldies English Facebook Reel

on:
  workflow_dispatch:
    inputs:
      preview_only:
        description: "Test MP4 only; no Facebook publish or WordPress delivery"
        type: boolean
        default: true
      history_date:
        description: "Optional YYYY-MM-DD history date for a preview"
        type: string
        default: ""
      preview_artist:
        description: "Optional artist for a preview"
        type: string
        default: ""
  push:
    branches: [main, fix/facebook-global-dj-voice]
    paths:
      - ".github/manual-facebook-trigger"
      - ".github/facebook-global-preview-trigger"
  schedule:
    - cron: "0 11 * * *"

permissions:
  contents: write
  id-token: write

concurrency:
  group: oldies-english-facebook-reel
  cancel-in-progress: false

jobs:
  publish-facebook:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - id: auth
        name: Authenticate with the existing Oldies TTS identity
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/36507074949/locations/global/workloadIdentityPools/github-oldies/providers/github-oldies-reels"
          service_account: "oldies-reels-tts@project-8af3c2f9-bd84-4afe-b8a.iam.gserviceaccount.com"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Facebook audio failure gates
        run: python -m unittest test_facebook_global_audio -v

      - name: Create English DJ Reel and validate audio before delivery
        env:
          OLDIES_WP_BEARER: ${{ secrets.OLDIES_WP_BEARER }}
          OLDIES_WP_BASE_URL: ${{ vars.OLDIES_WP_BASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          OLDIES_PREVIEW_ONLY: ${{ github.ref_name != 'main' || (github.event_name == 'workflow_dispatch' && inputs.preview_only) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[facebook-preview]')) }}
          OLDIES_ZERO_COST_DATE: ${{ inputs.history_date || (github.ref_name != 'main' && '2026-10-05' || '') }}
          OLDIES_PREVIEW_ARTIST: ${{ inputs.preview_artist || (github.ref_name != 'main' && 'The Beatles' || '') }}
          OLDIES_REELS_LANGUAGE: "en"
          OLDIES_TTS_ENABLED: "true"
          OLDIES_TTS_FALLBACK: "false"
          OLDIES_TTS_ENGINE: "facebook_dj"
          OLDIES_GCP_PROJECT: "project-8af3c2f9-bd84-4afe-b8a"
        run: python worker.py

      - name: Keep audit files for seven days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oldies-english-facebook-reel
          path: output/
          retention-days: 7
          if-no-files-found: ignore
