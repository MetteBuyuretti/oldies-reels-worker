name: OLDIES Editorial Quality Gate (offline)

on:
  pull_request:
    paths:
      - "editorial_quality_gate.py"
      - "test_editorial_quality_gate.py"
      - "worker.py"
      - "video_factory.py"
      - "test_announcer.py"
      - "test_reels_duration_contract.py"
      - ".github/workflows/editorial-quality-gate.yml"
  workflow_dispatch:

permissions: {}

jobs:
  offline-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify editorial delivery refuses unsuitable material
        run: python -m unittest -v test_editorial_quality_gate test_reels_duration_contract
