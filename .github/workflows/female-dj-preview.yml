name: Female DJ voice audition

on:
  push:
    branches: [feature/female-dj-voice]
    paths:
      - "preview_female_dj.py"
      - ".github/workflows/female-dj-preview.yml"

permissions:
  contents: read
  id-token: write

jobs:
  audition:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/36507074949/locations/global/workloadIdentityPools/github-oldies/providers/github-oldies-reels"
          service_account: "oldies-reels-tts@project-8af3c2f9-bd84-4afe-b8a.iam.gserviceaccount.com"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt
      - name: Generate female voice examples
        env:
          OLDIES_GCP_PROJECT: "project-8af3c2f9-bd84-4afe-b8a"
        run: python preview_female_dj.py
      - name: Save voice examples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: female-dj-auditions
          path: output/female-dj-preview/
          retention-days: 7
          if-no-files-found: ignore
